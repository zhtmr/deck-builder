<!doctype html>
<html lang="ko" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --accent: {{ACCENT}};
  --bg:#0a0f1e; --bg2:#0f1629; --panel:#121a30; --fg:#e8edf7; --muted:#8b97b3; --edge:#3a4766; --line:#1d2742;
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="light"]{
  --bg:#f7f8fb; --bg2:#eef1f7; --panel:#ffffff; --fg:#141a2b; --muted:#5b6680; --edge:#b7c0d4; --line:#e2e6ef;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
body{display:grid;place-items:center}
#stage{position:relative;width:1600px;height:900px;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;padding:64px 88px 56px;visibility:hidden;opacity:0;
  transition:opacity .5s ease,transform .75s cubic-bezier(.22,1,.36,1),visibility 0s .75s;
  background:radial-gradient(1200px 600px at 85% -10%, color-mix(in srgb,var(--accent) 9%, transparent), transparent 60%),
             linear-gradient(var(--bg),var(--bg2));overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.slide.active{visibility:visible;opacity:1;transform:none;transition:opacity .5s ease,transform .75s cubic-bezier(.22,1,.36,1)}
.slide > *{position:relative;z-index:1}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h2{font-size:44px;font-weight:800;margin-bottom:34px}
h2::before{content:"";display:inline-block;width:10px;height:34px;border-radius:3px;background:var(--accent);margin-right:18px;vertical-align:-4px}
code{font-family:var(--mono);font-size:.88em;background:color-mix(in srgb,var(--accent) 14%,transparent);padding:.08em .4em;border-radius:6px}
b{color:var(--accent);font-weight:700}
.pg{position:absolute;right:40px;bottom:26px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.notes{display:none}
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);transition:width .35s;z-index:5}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:rgba(0,0,0,.85);color:#fff;font:18px/1.6 var(--font);
  padding:18px 28px;display:none;z-index:9;white-space:pre-wrap}
body.show-notes #notes{display:block}

/* ---------- title / section ---------- */
.title-wrap{position:absolute!important;left:96px;top:0;bottom:0;width:700px;display:flex;flex-direction:column;justify-content:center;z-index:2}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.t-title h1{font-size:76px;line-height:1.12;font-weight:850}
.sub{font-size:28px;color:var(--muted);margin-top:22px;line-height:1.5}
.meta{margin-top:56px;font-size:20px;color:var(--fg);display:flex;gap:24px}
.meta span{color:var(--muted)}
.title-bg{position:absolute!important;right:-30px;top:110px;width:840px;height:680px;opacity:.6;
  mask-image:linear-gradient(90deg,transparent 0%,#000 22%)}
.title-bg svg{width:100%;height:100%}
.title-bg .e-lab,.title-bg .n-tech{display:none}
.sec{height:100%;display:flex;flex-direction:column;justify-content:center;padding-left:24px}
.sec-no{font-size:120px;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--accent);line-height:1;margin-bottom:12px}
.sec h1{font-size:72px;font-weight:850}
.end{align-items:center;text-align:center;padding:0}

/* ---------- bullets / stats / split ---------- */
.bul{list-style:none;margin:0;padding:0;font-size:32px;line-height:1.5;max-width:1300px}
.bul > li{padding:14px 0 14px 46px;position:relative;border-bottom:1px solid var(--line)}
.bul > li::before{content:"";position:absolute;left:6px;top:30px;width:14px;height:14px;border-radius:4px;background:var(--accent);transform:rotate(45deg)}
.bul ul{margin:8px 0 0;padding-left:26px;font-size:25px;color:var(--muted)}
.frag{opacity:0;transform:translateY(var(--fy,18px));transition:opacity .45s ease,transform .7s cubic-bezier(.34,1.35,.64,1)}
.frag.on,.all .frag{opacity:1;transform:none}
/* 클릭 프리셋(Slidev v-click 의 fade/up/left/right/scale 대응): 슬라이드 fx 필드 또는 타입별 기본값 */
.t-stats .frag,.t-bento .frag,[data-fx=scale] .frag{transform:scale(.88)}
.t-terminal .frag,[data-fx=left] .frag{transform:translateX(-26px)}
[data-fx=right] .frag{transform:translateX(26px)}
[data-fx=fade] .frag{transform:none}
[data-fx=up] .frag{transform:translateY(18px)}
.frag.on,.all .frag,.t-stats .frag.on,.t-bento .frag.on,.t-terminal .frag.on,[data-fx] .frag.on{opacity:1;transform:none}
.stats{display:grid;gap:28px;margin-top:40px}
.stats.n1{grid-template-columns:1fr}.stats.n2{grid-template-columns:repeat(2,1fr)}.stats.n3{grid-template-columns:repeat(3,1fr)}
.stats.n4,.stats.n5,.stats.n6{grid-template-columns:repeat(3,1fr)}.stats.n4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:40px 36px;border-top:4px solid var(--accent)}
.stat .v{font-size:76px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{font-size:26px;margin-top:8px;font-weight:600}
.stat .h{font-size:19px;color:var(--muted);margin-top:10px;line-height:1.5}
.split{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 40px}
.col h3{font-size:30px;margin-bottom:16px;color:var(--accent)}
.col ul{margin:0;padding-left:26px;font-size:25px;line-height:1.7}

/* ---------- code ---------- */
.code-wrap{display:grid;grid-template-columns:1fr;gap:32px}
.code-wrap.with-pts{grid-template-columns:1fr 420px}
.code{background:#0b1222;border:1px solid var(--line);border-radius:18px;overflow:hidden}
html[data-theme="light"] .code{background:#0f172a}
.code .file{font:600 15px var(--mono);color:#8b97b3;padding:14px 22px;border-bottom:1px solid #1d2742;background:#0e1628}
.code pre{margin:0;padding:18px 0;max-height:640px;overflow:hidden}
.code pre code{background:none;padding:0;font-size:19px;line-height:1.6;color:#d5def0;display:block}
.code .ln{display:block;padding:0 24px 0 72px;position:relative;white-space:pre}
.code .ln::before{content:attr(data-n);position:absolute;left:0;width:52px;text-align:right;color:#4a5878}
.code .ln.hl{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 4px 0 var(--accent)}
.code-pts{margin:0;padding:0;list-style:none;font-size:24px;line-height:1.55}
.code-pts li{padding:16px 0;border-bottom:1px solid var(--line)}

/* ---------- topology ---------- */
.topo-wrap{height:690px;position:relative}
.topo{width:100%;height:100%;overflow:visible;font-family:var(--font)}
.cap{position:absolute!important;left:88px;bottom:30px;font-size:20px;color:var(--muted);margin:0;max-width:1100px}
.legend{position:absolute!important;right:88px;top:136px;display:flex;gap:18px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend i.dash{background:none;border-top:2px dashed var(--muted);border-radius:0;height:0;width:18px;vertical-align:3px}
.node{transform-box:fill-box;transform-origin:center;opacity:0}
.slide.active .node{animation:nodeIn .55s cubic-bezier(.2,.8,.2,1) var(--d) both}
@keyframes nodeIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.n-body{fill:color-mix(in srgb,var(--c) 13%,var(--panel));stroke:var(--c);stroke-width:1.6;transition:stroke-width .3s,fill .3s}
.n-rim{fill:none;stroke:var(--c);stroke-width:1.4;opacity:.8}
.n-tag{fill:var(--c);font-size:11px;font-weight:800;letter-spacing:.14em;text-anchor:middle}
.n-label{fill:var(--fg);font-weight:700;text-anchor:middle}
.n-tech{fill:var(--muted);font-size:13px;text-anchor:middle}
.node.hot .n-body{fill:color-mix(in srgb,var(--c) 32%,var(--panel));stroke-width:3.2;filter:drop-shadow(0 0 14px var(--c))}
.node.visited .n-body{stroke-width:2.4;fill:color-mix(in srgb,var(--c) 22%,var(--panel))}
.node.dim,.edge.dim{opacity:.18!important;transition:opacity .4s}
.e-geo{fill:none;stroke:none}
.e-base{fill:none;stroke:var(--edge);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.slide.active .e-base{animation:draw .9s ease var(--d) forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
.ar{fill:var(--edge)} .arh{fill:var(--accent)}
.e-ants{display:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 7;opacity:0}
.async .e-ants{display:inline}
.slide.active .async .e-ants{animation:antsIn .3s ease calc(var(--d) + .9s) forwards, ants 1.1s linear infinite}
.async .e-base{stroke-opacity:.25}
@keyframes ants{to{stroke-dashoffset:-20}}
@keyframes antsIn{to{opacity:.8}}
.e-hl{fill:none;stroke:var(--accent);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;
  transition:stroke-dashoffset .6s ease,opacity .2s,stroke-width .3s}
.edge.on .e-hl{opacity:1;stroke-dashoffset:0}
.edge.done .e-hl{opacity:.38;stroke-dashoffset:0;stroke-width:2.6}
.e-lab rect{fill:var(--bg);stroke:var(--line)}
.e-lab text{fill:var(--muted);font-size:12.5px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.e-lab{opacity:0;transition:opacity .3s}
.slide.active .e-lab{animation:fade .4s ease calc(var(--d) + .7s) forwards}
.t-flow .slide.active .e-lab, .t-flow.active .e-lab{animation:none;opacity:0}
.t-flow .edge.on .e-lab,.t-flow .edge.done .e-lab{opacity:1}
.edge.on .e-lab text{fill:var(--accent)} .edge.on .e-lab rect{stroke:var(--accent)}
@keyframes fade{to{opacity:1}}
.packets circle{fill:var(--accent)}

/* ---------- flow ---------- */
.flow-grid{display:grid;grid-template-columns:940px 1fr;gap:28px;height:700px}
.flow-grid .topo-wrap{height:700px}
.steps{overflow:hidden;display:flex;flex-direction:column}
.fdesc{margin:0 0 14px;color:var(--muted);font-size:18px;line-height:1.5}
.steps ol{list-style:none;margin:0;padding:0;overflow:hidden;flex:1;position:relative;
  mask-image:linear-gradient(transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%)}
.steps li{display:flex;gap:14px;padding:9px 14px;border-radius:14px;opacity:.38;transition:opacity .3s,background .3s;margin-bottom:2px}
.steps li .no{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;
  border:2px solid var(--muted);color:var(--muted)}
.steps .hop{font-weight:700;font-size:19px}
.steps .hop i{font-style:normal;color:var(--accent);margin:0 4px}
.steps .note{font-size:16.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.steps li.done{opacity:.75}
.steps li.done .no{border-color:var(--accent);color:var(--accent)}
.steps li.on{opacity:1;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.steps li.on .no{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* ---------- toss 테마: 흰 배경 · 블루 포인트 · 큰 굵은 타이포 · 넉넉한 여백 · 둥근 카드 ---------- */
html[data-theme="toss"]{
  --bg:#ffffff; --bg2:#ffffff; --panel:#f2f4f6; --fg:#191f28; --muted:#6b7684; --edge:#d1d6db; --line:#e5e8eb;
}
html[data-theme="toss"] .slide{background:#fff;padding:72px 96px 60px}
html[data-theme="toss"] .slide::before{display:none}
html[data-theme="toss"] h2{font-size:48px;font-weight:700;letter-spacing:-.035em;margin-bottom:40px}
html[data-theme="toss"] h2::before{display:none}
html[data-theme="toss"] b{color:var(--accent);font-weight:700}
html[data-theme="toss"] code{background:#f2f4f6;color:#4e5968}
html[data-theme="toss"] .eyebrow{letter-spacing:0;text-transform:none;font-size:24px;font-weight:600}
html[data-theme="toss"] .t-title h1{font-size:80px;font-weight:700;letter-spacing:-.04em}
html[data-theme="toss"] .sub{color:#8b95a1}
html[data-theme="toss"] .title-bg{opacity:.9}
html[data-theme="toss"] .sec-no{-webkit-text-stroke:0;color:var(--accent);font-size:28px;font-weight:700;margin-bottom:20px}
html[data-theme="toss"] .sec h1{font-size:68px;font-weight:700;letter-spacing:-.04em}
html[data-theme="toss"] .bul{display:flex;flex-direction:column;gap:16px;font-size:30px}
html[data-theme="toss"] .bul > li{background:#f9fafb;border:0;border-radius:24px;padding:26px 34px 26px 74px}
html[data-theme="toss"] .bul > li::before{left:34px;top:40px;width:12px;height:12px;border-radius:50%;transform:none}
html[data-theme="toss"] .bul ul{color:#6b7684}
html[data-theme="toss"] .stat,html[data-theme="toss"] .col{background:#f9fafb;border:0;border-radius:28px}
html[data-theme="toss"] .stat .v{color:var(--accent);font-weight:700}
html[data-theme="toss"] .stat .l{color:#333d4b}
html[data-theme="toss"] .col h3{color:#191f28}
html[data-theme="toss"] .code{background:#191f28;border:0;border-radius:24px}
html[data-theme="toss"] .code .file{background:#191f28;border-color:#333d4b}
html[data-theme="toss"] .code-pts li{border-color:#f2f4f6}
html[data-theme="toss"] .n-body{fill:#fff;stroke:#e5e8eb;stroke-width:1.2;filter:drop-shadow(0 6px 14px rgba(0,27,55,.08))}
html[data-theme="toss"] .n-rim{stroke:var(--c);opacity:.6}
html[data-theme="toss"] .n-tag{font-size:11.5px;letter-spacing:.06em}
html[data-theme="toss"] .n-label{fill:#191f28}
html[data-theme="toss"] .n-tech{fill:#8b95a1}
html[data-theme="toss"] .node.hot .n-body{fill:#e8f3ff;stroke:var(--accent);stroke-width:2.4;filter:drop-shadow(0 8px 20px rgba(49,130,246,.28))}
html[data-theme="toss"] .node.visited .n-body{stroke:#90c2ff;stroke-width:1.6;fill:#f5faff}
html[data-theme="toss"] .ar{fill:#c5cbd1}
html[data-theme="toss"] .e-ants{stroke:#8b95a1}
html[data-theme="toss"] .e-lab rect{fill:#fff;stroke:#e5e8eb}
html[data-theme="toss"] .e-lab text{fill:#6b7684}
html[data-theme="toss"] .steps li{opacity:.45}
html[data-theme="toss"] .steps li.on{background:#e8f3ff;opacity:1}
html[data-theme="toss"] .steps li.on .no{color:#fff}
html[data-theme="toss"] .legend{color:#8b95a1}
html[data-theme="toss"] #progress{height:4px}

/* ---------- stats: 카운트업 · 비교 막대 ---------- */
.stat .sbar{height:10px;border-radius:6px;background:var(--line);margin-top:22px;overflow:hidden}
.stat .sbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1) .2s}
.stat.on .sbar i{width:var(--w)}
.stat .v{white-space:nowrap}
.stat .v.long{font-size:56px}
.stat .v .num{font-variant-numeric:tabular-nums}

/* ---------- code walkthrough ---------- */
.code .ln{transition:opacity .35s,background .35s}
.code .ln.dim{opacity:.32}
.code-pts li.walk{opacity:.35;transition:opacity .3s,background .3s;border-radius:12px;padding:16px 14px}
.code-pts li.walk.done{opacity:.6}
.code-pts li.walk.on{opacity:1;background:color-mix(in srgb,var(--accent) 12%,transparent)}

/* ---------- terminal ---------- */
.term{background:#0b0d12;border:1px solid #232a3a;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.3);max-width:1424px}
.tbar{display:flex;align-items:center;gap:9px;padding:14px 20px;background:#141824;border-bottom:1px solid #232a3a}
.tbar i{width:13px;height:13px;border-radius:50%;background:#3a4256}
.tbar i:nth-child(1){background:#ff5f57}.tbar i:nth-child(2){background:#febc2e}.tbar i:nth-child(3){background:#28c840}
.tbar span{margin-left:14px;font:600 15px var(--mono);color:#8b97b3}
.tbody{padding:26px 34px 30px;font-family:var(--mono);color:#d5def0}
.tcmd{font-size:24px;margin-bottom:22px;min-height:36px}
.tcmd::before{content:"$ ";color:#34d399}
.tcmd .cmd::after{content:"▍";color:#8b97b3;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.trow{display:grid;grid-template-columns:1fr 300px 82px 150px;align-items:center;gap:20px;padding:11px 0;font-size:21px}
.trow .tlab{font-family:var(--font);font-weight:600;color:#e8edf7}
.trow .trk{height:10px;border-radius:6px;background:#1c2233;overflow:hidden}
.trow .trk i{display:block;height:100%;width:0;border-radius:6px;background:var(--sc);transition:width 1s cubic-bezier(.2,.8,.2,1) .15s}
.trow.on .trk i{width:var(--w)}
.tbadge{font-weight:800;font-size:17px;color:var(--sc);transform:scale(0);transition:transform .5s cubic-bezier(.34,1.56,.64,1) .8s}
.trow.on .tbadge{transform:none}
.trow .td{font-size:17px;color:#7d89a6;text-align:right}
.trow.ok{--sc:#34d399}.trow.warn{--sc:#fbbf24}.trow.fail{--sc:#f87171}
.tsum{margin-top:18px;padding:14px 22px;border-radius:12px;font:700 22px var(--font);background:color-mix(in srgb,#34d399 14%,transparent);color:#34d399;display:inline-block}
.tsum.warn{background:color-mix(in srgb,#fbbf24 14%,transparent);color:#fbbf24}
.tsum.fail{background:color-mix(in srgb,#f87171 14%,transparent);color:#f87171}

/* ---------- bento ---------- */
.bento{display:grid;gap:26px}
.bento.n3{grid-template-columns:repeat(3,1fr)}.bento.n4{grid-template-columns:repeat(2,1fr)}.bento.n2{grid-template-columns:repeat(2,1fr)}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:34px 36px;position:relative;overflow:hidden;
  transition:opacity .4s,transform .4s,box-shadow .3s,border-color .3s}
.bcard:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 40px color-mix(in srgb,var(--accent) 22%,transparent)}
.bcard .ic{font-size:40px;line-height:1;margin-bottom:16px}
.bcard h3{font-size:31px;font-weight:750;margin-bottom:12px}
.bcard p{margin:0;font-size:23px;line-height:1.55;color:var(--muted)}
.bento.n4 .bcard{padding:28px 36px}
html[data-theme="toss"] .bcard{background:#f9fafb;border:0;border-radius:28px}

/* ---------- timeline ---------- */
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:20px;position:relative;margin-top:70px}
.tl::before{content:"";position:absolute;left:0;right:0;top:15px;height:3px;background:var(--line)}
.tl-item{position:relative;padding-top:50px}
.tl-item::before{content:"";position:absolute;left:0;top:6px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);
  transition:background .3s}
.tl-item.on::before{background:var(--accent)}
.tl-item .per{font-size:21px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.tl-item h3{font-size:28px;font-weight:750;margin:8px 0 10px}
.tl-item p{margin:0;font-size:20px;line-height:1.55;color:var(--muted)}

/* ---------- 슬라이드 전환 (방향 인식: 앞으로 가면 이전 장은 왼쪽/위로 빠진다) ---------- */
.slide[data-tr=slide-left].before{transform:translateX(-7%)}  .slide[data-tr=slide-left].after{transform:translateX(7%)}
.slide[data-tr=slide-up].before{transform:translateY(-7%)}    .slide[data-tr=slide-up].after{transform:translateY(7%)}
.slide[data-tr=zoom].before{transform:scale(1.08)}            .slide[data-tr=zoom].after{transform:scale(.92)}
.slide[data-tr=none],.slide[data-tr=none].active{transition:none}

/* ---------- 단어 단위 등장 · 제목 입장 ---------- */
.words .w{display:inline-block;opacity:0;transform:translateY(.45em)}
.slide.active .words .w{animation:wordIn .8s cubic-bezier(.22,1,.36,1) calc(var(--i) * 75ms + .15s) forwards}
@keyframes wordIn{to{opacity:1;transform:none}}
.slide.active h2{animation:hIn .7s cubic-bezier(.22,1,.36,1) both}
@keyframes hIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.slide.active .eyebrow,.slide.active .sub{animation:hIn .8s cubic-bezier(.22,1,.36,1) .35s both}

/* ---------- 배경 글로우가 천천히 흐른다 ---------- */
.slide::after{content:"";z-index:0;position:absolute;width:900px;height:900px;left:-260px;top:-380px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 15%,transparent),transparent 65%);filter:blur(24px);opacity:0}
.slide.active::after{opacity:1;animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(900px,420px) scale(1.25)}}
html[data-theme="toss"] .slide::after{display:none}

/* ---------- statement · quote ---------- */
.t-statement,.t-quote{display:flex;flex-direction:column;justify-content:center;padding-left:140px;padding-right:140px}
.kicker{font-size:22px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.statement{font-size:84px;line-height:1.2;font-weight:850;letter-spacing:-.03em;margin:0}
.t-quote blockquote{margin:0;font-size:58px;line-height:1.35;font-weight:700;letter-spacing:-.025em;position:relative;padding-left:70px}
.t-quote blockquote::before{content:"“";position:absolute;left:-6px;top:-34px;font-size:150px;line-height:1;color:var(--accent);font-family:Georgia,serif}
.t-quote .by{margin-top:34px;padding-left:70px;font-size:24px;color:var(--muted)}
html[data-theme="toss"] .statement{font-weight:700;letter-spacing:-.04em}

/* ---------- 코드 매직무브 ---------- */
.code.big pre code{font-size:27px;line-height:1.65}
.code.big .ln{padding-left:84px}
.code.big .ln::before{width:62px}
.code.big .file{font-size:17px}
.code-wrap.with-pts{grid-template-columns:1fr 460px}
.code-pts li.walk{font-size:25px}
.code pre{position:relative}
.code .ln.new{animation:lineIn .9s ease both}
@keyframes lineIn{0%{opacity:0;background:color-mix(in srgb,var(--accent) 34%,transparent)}35%{opacity:1}100%{background:transparent}}
.code .ln.gone{position:absolute;left:0;right:0;pointer-events:none;transition:opacity .35s ease;opacity:0}

/* ---------- 오버뷰 (o 키) ---------- */
#overview{position:fixed;inset:0;z-index:20;background:rgba(6,9,18,.92);backdrop-filter:blur(10px);display:none;overflow:auto;
  padding:40px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px;align-content:start}
body.overview #overview{display:grid}
#overview .th{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .3s cubic-bezier(.34,1.35,.64,1)}
#overview .th:hover{transform:scale(1.03);border-color:var(--accent)}
#overview .th.cur{border-color:var(--accent)}
#overview .th .slide{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;visibility:visible!important;opacity:1!important;transition:none!important}
#overview .th .slide *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
#overview .th .slide::after{display:none}
#overview .th b.no{position:absolute;left:10px;bottom:8px;z-index:3;font:700 14px var(--font);background:rgba(0,0,0,.65);color:#fff;padding:2px 9px;border-radius:99px}

/* ---------- image: 스크린샷 + 단계별 하이라이트 ---------- */
.shot{margin:0;position:relative;display:flex;flex-direction:column;align-items:center}
.shot-in{position:relative;display:inline-block;max-width:100%;border-radius:18px;overflow:visible;
  box-shadow:0 0 0 1px var(--line),0 40px 90px rgba(0,0,0,.45)}
.shot-in img{display:block;max-width:1380px;max-height:620px;border-radius:18px;transition:filter .5s}
.shot-in:has(.mark.on) img{filter:brightness(.55) saturate(.9)}
.shot.cover .shot-in img{width:1380px;height:620px;object-fit:cover}
.mark{position:absolute;border:3px solid var(--accent);border-radius:10px;box-shadow:0 0 0 9999px transparent,0 0 28px color-mix(in srgb,var(--accent) 55%,transparent);
  background:color-mix(in srgb,var(--accent) 7%,transparent)}
.mark.frag{transform:scale(1.06)}
.mark.on:not(.cur){opacity:.4}
.mark span{position:absolute;left:0;top:100%;margin-top:12px;white-space:nowrap;background:var(--accent);color:#04101f;font:700 22px var(--font);padding:7px 16px;border-radius:99px}
.mark.up span{top:auto;bottom:100%;margin:0 0 12px}
.shot figcaption{margin-top:22px;font-size:22px;color:var(--muted)}
.slide.active .shot-in{animation:shotIn .9s cubic-bezier(.22,1,.36,1) both}
@keyframes shotIn{from{opacity:0;transform:translateY(26px) scale(.965)}to{opacity:1;transform:none}}

/* ---------- scene: 작성자 스크립트로 그리는 장면 (GSAP · Canvas · SVG · WebGL · Three.js) ---------- */
.t-scene:not(.full){display:flex;flex-direction:column}
.scene-wrap{position:relative;flex:1;min-height:0}
.t-scene:has(.cap) .scene-wrap{margin-bottom:44px}
.t-scene .scene{position:absolute;inset:0}
.scene > svg{width:100%;height:100%;overflow:visible}
.scene-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.t-scene.full .scene-wrap{position:absolute!important;inset:0;z-index:0;margin:0}
.t-scene.full h2{text-shadow:0 2px 24px var(--bg)}
.scene-fb{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:40px;font-size:24px;color:var(--muted);
  border:1px dashed var(--edge);border-radius:18px}
.scene-wrap.err .scene-fb{display:grid}
.scene-wrap.err .scene{display:none}

/* ---------- aurora 테마: 검은 배경 · 천천히 흐르는 블러 그라데이션 · 가벼운 큰 타이포 · 유리 카드 ---------- */
html[data-theme="aurora"]{
  --bg:#000; --bg2:#02040a; --panel:rgba(255,255,255,.035); --fg:#f4f6fb; --muted:#8d97ad; --edge:#3a465e; --line:rgba(255,255,255,.1);
  --fy:46px;
}
html[data-theme="aurora"] .slide{background:#000;padding:76px 100px 60px}
html[data-theme="aurora"] .slide::before{inset:-25%;mask-image:none;-webkit-mask-image:none;opacity:1;background-size:auto;
  background-image:
    radial-gradient(36% 40% at 20% 32%, color-mix(in srgb,var(--accent) 30%,transparent), transparent 70%),
    radial-gradient(32% 38% at 74% 80%, rgba(45,212,191,.17), transparent 70%),
    radial-gradient(28% 32% at 88% 16%, rgba(99,102,241,.17), transparent 70%)}
html[data-theme="aurora"] .slide.active::before{animation:aurora 28s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1) rotate(0)}100%{transform:translate3d(5%,-4%,0) scale(1.14) rotate(5deg)}}
html[data-theme="aurora"] .slide::after{display:none}
html[data-theme="aurora"] h2{font-size:58px;font-weight:500;letter-spacing:-.035em;margin-bottom:46px}
html[data-theme="aurora"] h2::before{display:none}
html[data-theme="aurora"] .eyebrow{letter-spacing:.02em;text-transform:none;font-size:24px;font-weight:500;color:var(--muted)}
html[data-theme="aurora"] .t-title h1{font-size:88px;font-weight:500;letter-spacing:-.045em;line-height:1.1}
html[data-theme="aurora"] .sub{color:var(--muted);font-weight:400}
html[data-theme="aurora"] .sec h1{font-weight:500;letter-spacing:-.04em}
html[data-theme="aurora"] .sec-no{-webkit-text-stroke:0;color:var(--accent);font-size:28px;font-weight:600;margin-bottom:22px}
html[data-theme="aurora"] .statement{font-weight:500}
html[data-theme="aurora"] .t-quote blockquote{font-weight:500}
html[data-theme="aurora"] b{color:var(--accent);font-weight:600}
html[data-theme="aurora"] .bul > li{border-bottom:1px solid rgba(255,255,255,.08)}
html[data-theme="aurora"] .bul > li::before{border-radius:50%;transform:none;width:9px;height:9px;top:36px;left:10px}
html[data-theme="aurora"] .stat,html[data-theme="aurora"] .col,html[data-theme="aurora"] .bcard{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 80px rgba(0,0,0,.4)}
html[data-theme="aurora"] .stat .v{font-weight:600}
html[data-theme="aurora"] .code{background:rgba(12,16,26,.74);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 0 0 7px rgba(255,255,255,.028),0 40px 100px color-mix(in srgb,var(--accent) 17%,transparent)}
html[data-theme="aurora"] .code .file{background:transparent;border-color:rgba(255,255,255,.08)}
html[data-theme="aurora"] .term{box-shadow:0 0 0 7px rgba(255,255,255,.028),0 40px 100px color-mix(in srgb,var(--accent) 14%,transparent)}
html[data-theme="aurora"] .legend{color:var(--muted)}
html[data-theme="aurora"] .e-lab rect{fill:#000}
html[data-theme="aurora"] .tl::before{background:rgba(255,255,255,.12)}
html[data-theme="aurora"] .tl-item::before{background:#000}
html[data-theme="aurora"] .tl-item.on::before{background:var(--accent)}

/* ---------- 정지 화면(스크린샷/인쇄) · 동작 줄이기 ---------- */
@media (prefers-reduced-motion: reduce){
  .slide *, .slide{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}
  .tcmd .cmd::after{animation:none}
}
body.still .slide *, body.still .slide{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
@media print{
  @page{size:1600px 900px;margin:0}
  html,body{overflow:visible;height:auto;display:block;background:none}
  #stage{transform:none!important;width:1600px;height:auto}
  .slide{position:relative;visibility:visible;opacity:1;transform:none!important;width:1600px;height:900px;page-break-after:always;break-after:page}
  .slide::after{display:none}
  .words .w{opacity:1!important;transform:none!important}
  #overview{display:none!important}
  .slide *{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
  .frag{opacity:1;transform:none}
  .stat .sbar i,.trow .trk i{width:var(--w)!important}
  .tbadge{transform:none!important}
  .code .ln.dim{opacity:1}.code-pts li.walk{opacity:1}
  .tcmd .cmd::after{display:none}
  .node{opacity:1}.e-base{opacity:1;stroke-dashoffset:0}.e-lab{opacity:1}
  #progress,#notes,.packets{display:none}
}
</style>
</head>
<body>
<div id="stage">
{{SLIDES}}
</div>
<div id="progress"></div>
<div id="notes"></div>
<div id="overview"></div>
{{SCENES}}
<script>
(() => {
  const stage = document.getElementById('stage');
  const slides = [...stage.querySelectorAll('.slide')];
  const prog = document.getElementById('progress');
  const notesBox = document.getElementById('notes');
  let cur = 0, step = 0, autoTimer = null, stageScale = 1;
  const packets = new Set();

  // ---------- 화면 맞춤 ----------
  function fit(){
    const s = stageScale = Math.min(innerWidth/1600, innerHeight/900);
    stage.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ---------- 간선 라벨 배치 ----------
  // 노드 안 텍스트가 상자보다 길면 글자 크기를 줄이고, 그래도 길면 말줄임
  function fitNodeText(root){
    root.querySelectorAll('.node').forEach(n => {
      const body = n.querySelector('.n-body'); if (!body) return;
      const maxW = body.getBBox().width - (n.classList.contains('k-queue') ? 34 : n.classList.contains('k-ai') ? 40 : 18);
      n.querySelectorAll('.n-label,.n-tech').forEach(t => {
        if (!t.dataset.full) t.dataset.full = t.textContent;
        t.textContent = t.dataset.full; t.style.fontSize = '';
        let fs = parseFloat(getComputedStyle(t).fontSize), min = fs * 0.72;
        while (t.getComputedTextLength() > maxW && fs > min){ fs -= 0.5; t.style.fontSize = fs + 'px'; }
        let s = t.dataset.full;
        while (t.getComputedTextLength() > maxW && s.length > 2){ s = s.slice(0, -1); t.textContent = s + '…'; }
      });
    });
  }

  // 간선 라벨: 노드·다른 라벨과 겹치지 않는 위치를 경로 위에서 찾는다
  function placeLabels(root){
    const hit = (a, b) => a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height;
    const area = (a, b) => Math.max(0, Math.min(a.x+a.width, b.x+b.width) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y+a.height, b.y+b.height) - Math.max(a.y, b.y));
    const obstacles = [...root.querySelectorAll('.node .n-body')].map(b => { const r = b.getBBox(); return {x:r.x-6, y:r.y-6, width:r.width+12, height:r.height+12}; });
    const nodeBoxes = obstacles.slice();
    const edges = [...root.querySelectorAll('.edge')].map(g => ({g, L: g.querySelector('.e-geo').getTotalLength()})).sort((a,b) => a.L - b.L);
    const ts = [.5,.42,.58,.34,.66,.26,.74,.2,.8,.14,.86];
    for (const {g, L} of edges){
      const geo = g.querySelector('.e-geo'), lab = g.querySelector('.e-lab');
      const t = lab.querySelector('text'), r = lab.querySelector('rect');
      if (!t.textContent.trim()){ lab.style.display='none'; continue; }
      let best = null;
      const cands = [];
      for (const u of ts) for (const dy of [0, -15, 15]) cands.push([u, dy]);
      for (const [u, dy] of cands){
        const q = geo.getPointAtLength(L*u), p = {x:q.x, y:q.y+dy};
        t.setAttribute('x', p.x); t.setAttribute('y', p.y);
        const bb = t.getBBox(), box = {x:bb.x-7, y:bb.y-3, width:bb.width+14, height:bb.height+6};
        const cost = obstacles.reduce((s,o) => s + area(box,o), 0) + Math.abs(u-.5)*40 + Math.abs(dy)*2;
        if (!best || cost < best.cost) best = {cost, p, box};
        if (!obstacles.some(o => hit(box,o))) { best = {cost, p, box}; break; }
      }
      // 노드와 겹칠 수밖에 없는 짧은 간선의 라벨은 숨긴다 (발표 중엔 흐름 패널이 같은 정보를 보여 줌)
      if (nodeBoxes.some(o => area(best.box, o) > best.box.width * best.box.height * 0.15)){ lab.style.display = 'none'; continue; }
      t.setAttribute('x', best.p.x); t.setAttribute('y', best.p.y);
      r.setAttribute('x', best.box.x); r.setAttribute('y', best.box.y);
      r.setAttribute('width', best.box.width); r.setAttribute('height', best.box.height);
      obstacles.push(best.box);
    }
  }
  function prepareSvgs(){ document.querySelectorAll('svg.topo').forEach(s => { fitNodeText(s); placeLabels(s); }); }

  // ---------- 패킷 애니메이션 ----------
  function addPacket(svg, edgeEl, reverse, opts={}){
    const geo = edgeEl.querySelector('.e-geo');
    const layer = svg.querySelector('.packets');
    const L = geo.getTotalLength();
    const dots = [7, 5, 3.4].map((r,i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('r', r); c.style.opacity = [1,.55,.3][i]; layer.appendChild(c); return c;
    });
    const pk = {geo, L, reverse, dots, t0: performance.now(), dur: opts.dur || Math.max(900, L*2.4), once: opts.once};
    packets.add(pk); return pk;
  }
  function clearPackets(scope){
    for (const pk of [...packets]){
      if (!scope || scope.contains(pk.geo)){ pk.dots.forEach(d=>d.remove()); packets.delete(pk); }
    }
  }
  function tick(now){
    for (const pk of packets){
      let t = (now - pk.t0) / pk.dur;
      if (pk.once && t >= 1){ pk.dots.forEach(d=>d.remove()); packets.delete(pk); continue; }
      t = t % 1;
      pk.dots.forEach((d,i) => {
        let u = Math.max(0, t - i*0.035);
        if (pk.reverse) u = 1-u;
        const p = pk.geo.getPointAtLength(u*pk.L);
        d.setAttribute('cx', p.x); d.setAttribute('cy', p.y);
      });
    }
    sceneFrame(now);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- 플로우 상태 ----------
  function nodeEl(svg, id){ return svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`); }
  function edgeEl(svg, id){ return svg.querySelector(`.edge[data-id="${CSS.escape(id)}"]`); }

  function applyFlow(slide, seq, k, opts={}){
    const svg = slide.querySelector('svg.topo');
    clearPackets(svg);
    svg.querySelectorAll('.edge').forEach(e => e.classList.remove('on','done'));
    svg.querySelectorAll('.node').forEach(n => n.classList.remove('hot','visited'));
    const lis = slide.querySelectorAll('.steps li');
    lis.forEach(li => li.classList.remove('on','done'));
    seq.forEach(([eid, rev], j) => {
      const e = edgeEl(svg, eid); if (!e) return;
      const a = nodeEl(svg, e.dataset.from), b = nodeEl(svg, e.dataset.to);
      if (j < k-1){ e.classList.add('done'); a&&a.classList.add('visited'); b&&b.classList.add('visited'); lis[j]&&lis[j].classList.add('done'); }
      if (j === k-1){
        e.classList.add('on'); a&&a.classList.add('hot'); b&&b.classList.add('hot');
        lis[j]&&lis[j].classList.add('on');
        if (!opts.still) addPacket(svg, e, rev, {once: opts.once, dur: opts.dur});
        const ol = slide.querySelector('.steps ol');
        if (ol && lis[j]){ const top = lis[j].offsetTop - ol.clientHeight/2 + lis[j].clientHeight/2; ol.scrollTo({top, behavior: opts.still?'auto':'smooth'}); }
      }
    });
  }

  function applyFocus(slide){
    const f = slide.dataset.focus; if (!f) return;
    const keep = new Set(JSON.parse(f));
    slide.querySelectorAll('.node').forEach(n => n.classList.toggle('dim', !keep.has(n.dataset.id)));
    slide.querySelectorAll('.edge').forEach(e => e.classList.toggle('dim', !(keep.has(e.dataset.from) && keep.has(e.dataset.to))));
  }

  function startAuto(slide){
    stopAuto();
    const seq = JSON.parse(slide.dataset.autoflow);
    let k = 0;
    const run = () => { k = k % (seq.length + 1) + 1; if (k > seq.length) k = 0; applyFlow(slide, seq, k, {once:true, dur:1300}); };
    autoTimer = setTimeout(function loop(){ run(); autoTimer = setTimeout(loop, k === 0 ? 900 : 1450); }, 1600);
  }
  function stopAuto(){ if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; } }

  // ---------- 카운트업 · 타이핑 · 코드 워크스루 ----------
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmtNum = (el, v) => {
    const dec = +el.dataset.dec || 0, s = v.toFixed(dec);
    return el.dataset.comma === '1' ? Number(s).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) : s;
  };
  function countUp(el, still){
    cancelAnimationFrame(el._raf);
    const to = +el.dataset.to;
    if (still){ el.textContent = fmtNum(el, to); return; }
    const t0 = performance.now(), dur = 1100;
    const f = now => {
      const t = Math.min(1, (now - t0) / dur);
      el.textContent = fmtNum(el, to * (1 - Math.pow(1 - t, 4)));   // easeOutQuart: 빠르게 올라가 목표값에 안착
      if (t < 1) el._raf = requestAnimationFrame(f);
    };
    el._raf = requestAnimationFrame(f);
  }
  function applyCounts(s, still){
    s.querySelectorAll('.stat .num').forEach(el => {
      const on = el.closest('.stat').classList.contains('on');
      if (on && !el.dataset.shown){ el.dataset.shown = '1'; countUp(el, still); }
      else if (!on && el.dataset.shown){ delete el.dataset.shown; cancelAnimationFrame(el._raf); el.textContent = fmtNum(el, 0); }
    });
  }
  function typeCmd(s, still){
    const c = s.querySelector('.cmd'); if (!c) return;
    const full = c.dataset.full;
    clearInterval(c._iv);
    if (still){ c.textContent = full; s.dataset.typed = '1'; return; }
    if (s.dataset.typed){ c.textContent = full; return; }
    s.dataset.typed = '1'; c.textContent = ''; let i = 0;
    c._iv = setInterval(() => { c.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(c._iv); }, 34);
  }
  function applyWalk(s, W, k){
    const lines = [...s.querySelectorAll('.code .ln')];
    const [a, b] = k > 0 ? W[k-1] : [0, 0];
    lines.forEach(l => {
      const n = +l.dataset.n, inr = k > 0 && n >= a && n <= b;
      l.classList.toggle('hl', inr); l.classList.toggle('dim', k > 0 && !inr);
    });
    s.querySelectorAll('.code-pts li').forEach((li, j) => {
      li.classList.toggle('done', j < k - 1); li.classList.toggle('on', j === k - 1);
    });
  }

  // ---------- 코드 매직무브: 줄 단위 LCS 로 유지/추가/삭제를 가려 FLIP 모핑 ----------
  function lcsPairs(a, b){
    const n = a.length, m = b.length, d = Array.from({length: n+1}, () => new Array(m+1).fill(0));
    for (let i = n-1; i >= 0; i--) for (let j = m-1; j >= 0; j--)
      d[i][j] = a[i] === b[j] ? d[i+1][j+1] + 1 : Math.max(d[i+1][j], d[i][j+1]);
    const pairs = []; let i = 0, j = 0;
    while (i < n && j < m){
      if (a[i] === b[j]){ pairs.push([i, j]); i++; j++; }
      else if (d[i+1][j] >= d[i][j+1]) i++; else j++;
    }
    return pairs;
  }
  function setLine(el, text, lang){
    el.dataset.t = text;
    if (window.hljs && lang && hljs.getLanguage(lang)) el.innerHTML = hljs.highlight(text || ' ', {language: lang, ignoreIllegals: true}).value;
    else el.textContent = text || ' ';
  }
  function magicRender(s, k, still){
    if (!still && s._mk === k) return;
    const M = JSON.parse(s.dataset.magic), code = s.querySelector('.code code');
    const lang = (code.className.match(/language-(\S+)/) || [])[1];
    const next = M[k].code.replace(/\n$/, '').split('\n');
    code.querySelectorAll('.gone').forEach(e => e.remove());
    const old = [...code.querySelectorAll('.ln')];
    const animate = !still && s._mk !== undefined && old.length > 0;
    const tops = old.map(e => e.offsetTop);
    const pairs = animate ? lcsPairs(old.map(e => e.dataset.t), next) : [];
    const keep = new Map(pairs.map(([i, j]) => [j, i])), used = new Set(pairs.map(p => p[0]));
    const gone = animate ? old.filter((_, i) => !used.has(i)) : [];
    if (!animate) old.forEach(e => e.remove());
    gone.forEach(e => { e.style.top = tops[old.indexOf(e)] + 'px'; e.style.opacity = 1; e.classList.add('gone'); });
    const frag = document.createDocumentFragment(), moved = [];
    next.forEach((t, j) => {
      let el;
      if (keep.has(j)){ el = old[keep.get(j)]; el.classList.remove('new', 'hl', 'dim'); moved.push([el, tops[keep.get(j)]]); }
      else { el = document.createElement('span'); el.className = 'ln' + (animate ? ' new' : ''); setLine(el, t, lang); }
      el.dataset.n = (+s.dataset.start || 1) + j;
      frag.appendChild(el);
    });
    code.appendChild(frag);
    moved.forEach(([el, from]) => {
      const dy = from - el.offsetTop; if (!dy) return;
      el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`;
    });
    void code.offsetWidth;
    moved.forEach(([el]) => {
      if (!el.style.transform) return;
      el.style.transition = 'transform .65s cubic-bezier(.22,1,.36,1)'; el.style.transform = '';
      setTimeout(() => { el.style.transition = ''; }, 700);
    });
    requestAnimationFrame(() => gone.forEach(e => { e.style.opacity = ''; setTimeout(() => e.remove(), 400); }));
    s._mk = k;
    s.querySelectorAll('.code-pts li').forEach((li, j) => { li.classList.toggle('done', j < k); li.classList.toggle('on', j === k); });
  }

  // ---------- scene: 작성자 스크립트 장면 (GSAP · Canvas · SVG · WebGL · Three.js) ----------
  // 처음 보여 줄 때 초기화한다(라이브러리 로드 시간, WebGL 컨텍스트 수 제한). 슬라이드를 떠나면 루프가 멈추고
  // enter/step 안에서 만든 GSAP 애니메이션은 되돌린다(다시 들어오면 enter 부터 새로).
  const SCENES = window.__SCENES || {}, libCache = {}, STILL_T = 1.5;
  let liveScene = null;
  function loadLib(L){
    if (!libCache[L.url]){
      const p = L.module ? import(L.url) : new Promise((ok, no) => {
        const sc = document.createElement('script'); sc.src = L.url;
        sc.onload = () => ok(L.global ? window[L.global] : true); sc.onerror = no;
        document.head.appendChild(sc);
      });
      libCache[L.url] = p.catch(() => { throw new Error('라이브러리를 불러오지 못했습니다: ' + L.name); });
    }
    return libCache[L.url];
  }
  function sizeCanvas(c, ctx){
    const pr = ctx.pixelRatio();
    c.width = Math.max(1, Math.round(ctx.width * pr)); c.height = Math.max(1, Math.round(ctx.height * pr));
    if (c._g2d) c._g2d.setTransform(pr, 0, 0, pr, 0, 0);   // 2D 는 무대 좌표(CSS px)로 그리면 된다
  }
  function sceneInit(s){
    const def = SCENES[s.dataset.scene], host = s.querySelector('.scene'), wrap = s.querySelector('.scene-wrap');
    const sc = {s, host, loops: new Set(), canvases: [], api: {}, entered: false, t0: 0, last: 0, g: null};
    const ctx = sc.ctx = {
      el: host, slide: s, lib: {}, model: window.__MODEL, reduced, still: false,
      get width(){ return host.clientWidth; }, get height(){ return host.clientHeight; },
      pixelRatio: () => Math.min(2, (devicePixelRatio || 1) * stageScale),
      theme(){
        const cs = getComputedStyle(s), v = k => cs.getPropertyValue(k).trim();
        return {name: document.documentElement.dataset.theme, accent: v('--accent'), fg: v('--fg'), muted: v('--muted'),
                bg: v('--bg'), panel: v('--panel'), line: v('--line'), edge: v('--edge')};
      },
      kindColor: k => (window.__KINDS || {})[k] || (window.__KINDS || {}).service,
      canvas(){ const c = document.createElement('canvas'); c.className = 'scene-cv'; host.prepend(c); sc.canvases.push(c); sizeCanvas(c, ctx); return c; },
      canvas2d(){ const c = ctx.canvas(); c._g2d = c.getContext('2d'); sizeCanvas(c, ctx); return c._g2d; },
      loop(fn){ sc.loops.add(fn); return () => sc.loops.delete(fn); },
    };
    return (async () => {
      try {
        if (!def) throw new Error('장면 스크립트가 없습니다');
        for (const L of def.libs) ctx.lib[L.name] = await loadLib(L);
        sc.api = (await def.run(ctx)) || {};
        s._sc = sc;
        return sc;
      } catch (e){
        wrap.classList.add('err');
        (/불러오지 못했/.test(e.message) ? console.warn : console.error)(`[scene ${+s.dataset.scene + 1}]`, e);
        return null;
      }
    })();
  }
  function sceneCall(sc, fn, ...args){
    const f = sc.api[fn]; if (!f) return;
    const run = () => { try { f(...args); } catch (e){ console.error(`[scene ${+sc.s.dataset.scene + 1}] ${fn}`, e); } };
    const G = window.gsap;
    if (G && G.context){ sc.g = sc.g || G.context(() => {}, sc.host); sc.g.add(run); } else run();
  }
  function sceneShow(s, k, still){
    s._scene = s._scene || sceneInit(s);
    liveScene = s;
    return s._scene.then(sc => {
      if (!sc || liveScene !== s) return;
      sc.ctx.still = still;
      if (!sc.entered){
        if (sc.g){ sc.g.revert(); sc.g = null; }
        sc.entered = true; sc.t0 = sc.last = performance.now(); sceneCall(sc, 'enter');
      }
      sceneCall(sc, 'step', k, still);
      if (still){
        // 정지 화면: 진행 중인 최상위 GSAP 애니메이션을 끝 상태로, 루프는 한 프레임만
        const G = window.gsap;
        if (sc.g && G) sc.g.data.forEach(a => { if (a.parent === G.globalTimeline && a.paused && !a.paused()) a.progress(1); });
        stillFrame(sc);
      }
    });
  }
  // 루프가 돌지 않는 상태(정지 화면, 비활성 슬라이드)에서 한 프레임만 다시 그린다
  function stillFrame(sc){ sc.loops.forEach(fn => { try { fn(STILL_T, 0); } catch (e){ console.error(e); } }); }
  function sceneHide(s){
    if (!s._scene) return;
    s._scene.then(sc => {
      if (!sc || !sc.entered) return;
      sc.entered = false; sceneCall(sc, 'leave');
      // 나가는 전환이 끝난 뒤 되돌린다 (전환 중에 장면이 튀지 않게)
      setTimeout(() => { if (!sc.entered && sc.g){ sc.g.revert(); sc.g = null; } }, 800);
    });
  }
  function sceneFrame(now){
    const sc = liveScene && liveScene._sc;
    if (!sc || !sc.entered || sc.ctx.still || document.hidden) { if (sc) sc.last = now; return; }
    const t = (now - sc.t0) / 1000, dt = Math.min(0.1, (now - sc.last) / 1000); sc.last = now;
    sc.loops.forEach(fn => { try { fn(t, dt); } catch (e){ sc.loops.delete(fn); console.error(`[scene ${+sc.s.dataset.scene + 1}] loop`, e); } });
  }
  addEventListener('resize', () => slides.forEach(s => {
    const sc = s._sc; if (!sc) return;
    sc.canvases.forEach(c => sizeCanvas(c, sc.ctx));
    sceneCall(sc, 'resize', sc.ctx.width, sc.ctx.height, sc.ctx.pixelRatio());
    if (sc.ctx.still || !sc.entered) stillFrame(sc);
  }));
  function sceneReady(){
    const s = slides[cur];
    if (!s._scene) return Promise.resolve(true);
    const done = s._scene.then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => r(true)))));
    return Promise.race([done, new Promise(r => setTimeout(() => r(false), 8000))]);
  }

  // ---------- 오버뷰 (o) ----------
  const ov = document.getElementById('overview');
  function openOverview(){
    ov.innerHTML = '';
    slides.forEach((s, i) => {
      const th = document.createElement('div'); th.className = 'th' + (i === cur ? ' cur' : '');
      const c = s.cloneNode(true); c.classList.remove('before', 'after'); c.classList.add('active');
      c.querySelectorAll('.frag').forEach(f => f.classList.add('on'));
      c.querySelectorAll('.stat .num').forEach(el => { el.textContent = fmtNum(el, +el.dataset.to); });
      c.querySelectorAll('.cmd').forEach(x => { x.textContent = x.dataset.full; });
      const cvs = c.querySelectorAll('canvas');   // 복제본 캔버스는 비어 있으므로 현재 픽셀을 옮겨 그린다
      s.querySelectorAll('canvas').forEach((src, j) => { try { cvs[j].getContext('2d').drawImage(src, 0, 0); } catch (e){} });
      const no = document.createElement('b'); no.className = 'no'; no.textContent = i + 1;
      th.append(c, no); ov.appendChild(th);
      th.addEventListener('click', e => { e.stopPropagation(); closeOverview(); go(i, 0); });
    });
    document.body.classList.add('overview');
    ov.querySelectorAll('.th').forEach(th => { th.firstChild.style.transform = `scale(${th.clientWidth / 1600})`; });
    const c = ov.querySelector('.th.cur'); if (c) c.scrollIntoView({block: 'center'});
  }
  function closeOverview(){ document.body.classList.remove('overview'); ov.innerHTML = ''; }

  // ---------- 렌더 ----------
  function render(still){
    still = still || reduced;
    slides.forEach((s,i) => { s.classList.toggle('active', i === cur); s.classList.toggle('before', i < cur); s.classList.toggle('after', i > cur); });
    const s = slides[cur];
    s.querySelectorAll('.frag').forEach((f,i) => f.classList.toggle('on', i < step));
    if (s.dataset.magic) magicRender(s, step, still);
    s.querySelectorAll('.mark').forEach((m, j) => m.classList.toggle('cur', j === step - 1));
    applyCounts(s, still); typeCmd(s, still);
    if (s.dataset.walk) applyWalk(s, JSON.parse(s.dataset.walk), step);
    stopAuto(); clearPackets();
    if (s.dataset.flow) applyFlow(s, JSON.parse(s.dataset.flow), step, {still});
    else if (s.dataset.autoflow && !still) startAuto(s);
    applyFocus(s);
    if (liveScene && liveScene !== s){ sceneHide(liveScene); liveScene = null; }
    if (s.dataset.scene !== undefined) sceneShow(s, step, still);
    prog.style.width = ((cur + 1) / slides.length * 100) + '%';
    notesBox.textContent = s.querySelector('.notes')?.textContent || '';
    if (location.hash !== '#' + (cur+1)) history.replaceState(null, '', '#' + (cur+1));
  }
  function restart(s){ s.classList.remove('active'); void s.offsetWidth; }

  function go(i, k=0, still=false){
    i = Math.max(0, Math.min(slides.length-1, i));
    if (i !== cur){ restart(slides[i]); delete slides[i].dataset.typed; }
    cur = i; step = Math.max(0, Math.min(+slides[i].dataset.steps || 0, k));
    render(still);
  }
  function next(){
    const max = +slides[cur].dataset.steps || 0;
    if (step < max){ step++; render(); } else if (cur < slides.length-1) go(cur+1, 0);
  }
  function prev(){
    if (step > 0){ step--; render(); } else if (cur > 0) go(cur-1, +slides[cur-1].dataset.steps || 0);
  }

  addEventListener('keydown', e => {
    if (document.body.classList.contains('overview')){
      if (e.key === 'o' || e.key === 'Escape') closeOverview();
      return;
    }
    if (e.key === 'o'){ openOverview(); return; }
    if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){ e.preventDefault(); next(); }
    else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){ e.preventDefault(); prev(); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(slides.length-1);
    else if (e.key === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
    else if (e.key === 's') document.body.classList.toggle('show-notes');
    else if (e.key === 't'){ const T = ['aurora','dark','light','toss'], h = document.documentElement; h.dataset.theme = T[(T.indexOf(h.dataset.theme)+1) % T.length];
      slides.forEach(x => { const sc = x._sc; if (!sc) return; sceneCall(sc, 'theme', sc.ctx.theme()); if (x !== liveScene || sc.ctx.still) stillFrame(sc); }); }
  });
  addEventListener('click', e => { if (e.target.closest('a') || document.body.classList.contains('overview')) return; (e.clientX < innerWidth/3 ? prev : next)(); });
  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
  addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) (dx < 0 ? next : prev)(); }, {passive:true});
  addEventListener('beforeprint', () => slides.forEach(s => {
    s.querySelectorAll('.stat .num').forEach(el => { el.dataset.shown = '1'; countUp(el, true); });
    s.querySelectorAll('.cmd').forEach(c => { c.textContent = c.dataset.full; });
    if (s.dataset.magic) magicRender(s, JSON.parse(s.dataset.magic).length - 1, true);
    if (s.dataset.flow){ const q = JSON.parse(s.dataset.flow); applyFlow(s, q, q.length, {still:true}); } }));

  // ---------- 코드 하이라이트 (온라인일 때만) ----------
  function highlight(){
    if (!window.hljs) return;
    document.querySelectorAll('.code code').forEach(c => {
      const lang = (c.className.match(/language-(\S+)/)||[])[1];
      if (!lang || !hljs.getLanguage(lang)) return;
      c.querySelectorAll('.ln').forEach(l => { l.innerHTML = hljs.highlight(l.textContent, {language: lang, ignoreIllegals: true}).value; });
    });
  }
  if (document.querySelector('.code')){
    const l = document.createElement('link'); l.rel='stylesheet';
    l.href='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css'; document.head.appendChild(l);
    const sc = document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js';
    sc.onload = highlight; document.head.appendChild(sc);
  }

  // ---------- 시작 ----------
  prepareSvgs();
  if (document.fonts) document.fonts.ready.then(prepareSvgs);
  const params = new URLSearchParams(location.search);
  if (params.has('still')) document.body.classList.add('still');
  const start = parseInt((location.hash||'').slice(1)) || 1;
  go(start-1, 0);
  window.deck = { go, next, prev, count: slides.length, steps: i => +slides[i].dataset.steps || 0, ready: sceneReady };
})();
</script>
</body>
</html>
